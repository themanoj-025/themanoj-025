# gitleaks allowlist. Only add entries that are provably safe test
# fixtures or docs that intentionally embed a pattern resembling a key.
# Never add a real secret here.
[allowlist]
# GitHub-style pattern guard: allow test fixtures that use 'ghp_' as a
# placeholder for README examples only. Real tokens must never be committed.
[[allowlist.regex]]
description = "placeholder pastes 'ghp_' prefixed test strings"
regex = 'ghp_[A-Za-z0-9]{36}'
 

# OpenAI-style tokens are not used in this toy portfolio repo.
# [allowlist.redis]
# commodity = "redis"
